spring:
  application:
    name: LogiDash
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

profrotas:
  api:
    url: ${PROFROTAS_URL}
    token: ${PROFROTAS_TOKEN}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

frontend:
  url: ${FRONTEND_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false